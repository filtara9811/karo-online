name: Build Android App
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which app to build (Phase 1 = oneqr)"
        required: true
        default: oneqr
        type: choice
        options: [oneqr, customer, vendor, staff, shop, referral]


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tool versions
        run: |
          node --version
          bun --version
          java -version

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Resolve app variant identity
        run: |
          set -e
          VARIANT="${{ github.event.inputs.variant || 'customer' }}"
          echo "Building variant: $VARIANT"
          node scripts/variant-env.mjs "$VARIANT" | tee -a "$GITHUB_ENV"
          cp "capacitor.config.$VARIANT.ts" capacitor.config.ts
          echo "✅ Using capacitor.config.$VARIANT.ts"

      - name: Show runner memory (build diagnostics)
        run: free -h || true

      - name: Build web bundle
        run: bun run build
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Capacitor sync (android)
        run: bunx cap sync android
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Apply native Android patches
        run: node scripts/patch-native-android.mjs
        env:
          APP_VERSION_CODE: ${{ github.run_number }}


      - name: Verify launcher icons present in every mipmap density
        run: |
          set -e
          MISSING=0
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_round.png; do
              P="android/app/src/main/res/mipmap-$d/$f"
              if [ ! -f "$P" ]; then
                echo "❌ MISSING: $P"
                MISSING=1
              else
                echo "✅ $P ($(stat -c%s "$P") bytes)"
              fi
            done
          done
          if [ $MISSING -ne 0 ]; then
            echo "Launcher icons missing — patch script did not produce them."
            exit 1
          fi


      - name: Ensure google-services.json is in place
        run: |
          set -e
          if [ ! -f android/app/google-services.json ]; then
            if [ -f google-services.json ]; then
              cp google-services.json android/app/google-services.json
              echo "✅ Copied google-services.json from project root → android/app/"
            else
              echo "❌ google-services.json missing at project root AND android/app/"
              exit 1
            fi
          fi
          if ! grep -q "\"$KARO_APP_ID\"" android/app/google-services.json; then
            echo "❌ Firebase: package $KARO_APP_ID is not registered in google-services.json."
            echo "   Register it in Firebase Console → Project settings → Add app → Android,"
            echo "   then re-download the merged google-services.json and commit it at repo root."
            exit 1
          fi
          echo "🔥 google-services.json present and contains $KARO_APP_ID"

          # Mirror for both buildTypes so processDebug/ReleaseGoogleServices always finds it.
          mkdir -p android/app/src/debug android/app/src/release
          cp android/app/google-services.json android/app/src/debug/google-services.json
          cp android/app/google-services.json android/app/src/release/google-services.json

      - name: Verify google-services plugin is applied
        run: |
          set -e
          grep -q "com.google.gms:google-services" android/build.gradle \
            && echo "✅ google-services classpath present in android/build.gradle" \
            || (echo "❌ google-services classpath missing"; exit 1)
          grep -q "com.google.gms.google-services" android/app/build.gradle \
            && echo "✅ google-services plugin applied in android/app/build.gradle" \
            || (echo "❌ google-services plugin not applied"; exit 1)

      - name: Decode and verify signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "::error::Play Store release signing secrets are missing. Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS."
            exit 1
          fi
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          mkdir -p /tmp/oneqr-signing
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks 2>/tmp/oneqr-signing/base64-error.txt; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/upload-keystore.jks
          fi
          KEYSTORE_SIZE=$(stat -c%s android/upload-keystore.jks)
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "::error::Decoded keystore is too small. ANDROID_KEYSTORE_BASE64 is corrupt or incomplete."
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" >/tmp/oneqr-signing/aliases.txt 2>/tmp/oneqr-signing/store-error.txt; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is incorrect or the keystore file is invalid."
            sed -E 's/(password|pass)[^[:space:]]*/[redacted]/gi' /tmp/oneqr-signing/store-error.txt
            exit 1
          fi
          if ! keytool -list -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>/tmp/oneqr-signing/alias-error.txt; then
            echo "::error::ANDROID_KEY_ALIAS was not found in the release keystore."
            exit 1
          fi
          if ! keytool -certreq -keystore android/upload-keystore.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -keypass "$KEY_PASSWORD" -file /tmp/oneqr-signing/key-password-check.csr >/dev/null 2>/tmp/oneqr-signing/key-error.txt; then
            echo "::error::ANDROID_KEY_PASSWORD is incorrect for ANDROID_KEY_ALIAS. If it equals the store password, remove ANDROID_KEY_PASSWORD or set it to the same value."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          def prop(value: str) -> str:
              return (value.replace('\\', '\\\\')
                           .replace('\n', '\\n')
                           .replace('\r', '\\r')
                           .replace('\t', '\\t')
                           .replace('=', '\\=')
                           .replace(':', '\\:')
                           .replace('#', '\\#')
                           .replace('!', '\\!'))

          store_password = os.environ['ANDROID_KEYSTORE_PASSWORD']
          key_password = os.environ.get('ANDROID_KEY_PASSWORD') or store_password
          values = {
              'storeFile': 'upload-keystore.jks',
              'storePassword': store_password,
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': key_password,
          }
          Path('android/key.properties').write_text(
              ''.join(f'{key}={prop(value)}\n' for key, value in values.items()),
              encoding='utf-8',
          )
          PY
          echo "✅ Release keystore, store password, alias and private-key password verified."

      - name: Verify OneQR release identity
        run: |
          set -euo pipefail
          test "$KARO_VARIANT" = "oneqr" || { echo "::error::Phase 1 build must resolve to variant oneqr."; exit 1; }
          test "$KARO_APP_ID" = "app.karoonline.oneqr" || { echo "::error::Unexpected OneQR package: $KARO_APP_ID"; exit 1; }
          grep -Fq 'applicationId = "app.karoonline.oneqr"' android/app/build.gradle || { echo "::error::Android applicationId is not app.karoonline.oneqr after native patching."; exit 1; }
          grep -Fq 'app.karoonline.oneqr' android/app/google-services.json || { echo "::error::Firebase config has no OneQR client."; exit 1; }
          test -s android/key.properties || { echo "::error::Release signing properties were not generated."; exit 1; }
          echo "✅ OneQR package, Firebase client and release signing are aligned."

      - name: Build signed release APK & Play Store AAB
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain :app:assembleRelease :app:bundleRelease --stacktrace --warning-mode all 2>&1 | tee build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "::group::Last 200 lines of full Gradle log"
          tail -200 build.log
          echo "::endgroup::"
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "::group::Detected Gradle failure details"
            grep -n -B8 -A45 -E "FAILURE:|What went wrong|Execution failed|Task .* failed|invalid source release|Keystore|keystore|signing|AAPT|resource .* not found|error:|Caused by:" build.log | tail -400 || true
            echo "::endgroup::"
            {
              echo "## ❌ OneQR Android release build failed"
              echo ""
              echo '```text'
              grep -B5 -A30 -E "What went wrong|Execution failed|Task .* failed|invalid source release|Keystore|keystore|signing|AAPT|resource .* not found|error:|Caused by:" build.log | tail -180 || tail -100 build.log
              echo '```'
              echo "Full log is available in the android-gradle-build-log artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$GRADLE_EXIT"

      - name: List release files
        run: |
          echo "📂 Listing android/app/build/outputs/apk/release/"
          ls -lah android/app/build/outputs/apk/release/ || echo "⚠️ No APK output directory found"
          echo "📂 Listing android/app/build/outputs/bundle/release/"
          ls -lah android/app/build/outputs/bundle/release/ || echo "⚠️ No AAB output directory found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: karo-${{ env.KARO_VARIANT }}-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: karo-${{ env.KARO_VARIANT }}-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store listing assets
        uses: actions/upload-artifact@v4
        with:
          name: karo-${{ env.KARO_VARIANT }}-store-assets
          path: |
            public/store/${{ env.KARO_VARIANT }}-*
            public/store/${{ env.KARO_VARIANT }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Add one-click download links to build summary
        run: |
          {
            echo "## ✅ $KARO_APP_NAME Android build ready"
            echo ""
            echo "- Variant: \`$KARO_VARIANT\`"
            echo "- Package: \`$KARO_APP_ID\`"
            echo ""
            echo "Artifacts section of this run:"
            echo "- **karo-$KARO_VARIANT-apk** → installable APK"
            echo "- **karo-$KARO_VARIANT-playstore-aab** → Play Store upload AAB"
            echo "- **karo-$KARO_VARIANT-store-assets** → icon + feature graphic (if present)"
            echo ""
            echo "Open this run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-build-log
          path: android/build.log
          if-no-files-found: warn
